[project]
name = "vartovii-trust-agent"
version = "2.0.0"
description = "Autonomous multi-agent trust intelligence system powered by Google ADK, Vertex AI Gemini, and MongoDB Atlas"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Vitalii Radionov"},
]
keywords = [
    "ai-agent", "google-adk", "gemini", "trust-intelligence",
    "multi-agent", "mongodb", "mcp", "fraud-detection",
]

dependencies = [
    "google-adk==2.0.0",
    "python-dotenv>=1.0.0",
    "pymongo[srv]>=4.7.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "services*", "demo*", "api*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
